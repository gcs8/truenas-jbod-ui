layout:
  # Fallback grid when no enclosure profile matches: 60 bays as 4 rows of 15.
  slot_count: 60
  rows: 4
  columns: 15
  # UI labels remain 00-59 by default.
  slot_number_base: 0
  # TrueNAS enclosure APIs often use 1-based slot numbering.
  api_slot_number_base: 1

# Files the app writes. The defaults follow the config file's location, so you
# only need these when the data or log folders live somewhere unusual.
paths:
  # Settings saved from admin that override the app section above.
  runtime_overrides_file: /app/config/runtime-overrides.yaml
  mapping_file: /app/data/slot_mappings.json
  sas_fabric_alias_file: /app/data/sas_fabric_aliases.json
  slot_detail_cache_file: /app/data/slot_detail_cache.json
  log_file: /app/logs/app.log
  # Optional custom profile file for profile-driven enclosure layouts.
  profile_file: /app/config/profiles.yaml

# Enclosure profiles normally live in profiles.yaml (see profiles.example.yaml),
# but a profiles list here is accepted too.
# profiles: []
