# Copy this file to config/config.yaml and change only the lines you need.
# Every value below is the built-in default unless the comment says otherwise,
# so a copied line you leave alone changes nothing. Values in .env win over
# this file. Keep secrets in .env or secret files, not here.

app:
  # Address and port the main UI listens on inside the container.
  host: 0.0.0.0
  port: 8080
  # Public URL the browser reaches the main UI through, for example
  # https://bays.example.test. Leave empty to let the app accept the origin it is
  # served from.
  public_origin: null
  # Browser auto-refresh cadence.
  refresh_interval_seconds: 30
  # How long a cached snapshot is served as fresh before a background refresh.
  snapshot_cache_ttl_seconds: 10
  # Reuse window for API, SSH, and BMC reads shared across pages.
  source_bundle_cache_ttl_seconds: 60
  # Older deployments set only this value; the two settings above take
  # precedence when present.
  cache_ttl_seconds: 10
  # Reuse window for per-disk SMART detail.
  smart_cache_ttl_seconds: 300
  # Reuse window for discovered sg_ses enclosure device paths on Linux hosts.
  sg_ses_device_cache_ttl_seconds: 300
  # Check GitHub for a newer release and show a notice in the main UI.
  release_check_enabled: true
  release_check_repo: gcs8/truenas-jbod-ui
  release_check_interval_seconds: 86400
  release_check_timeout_seconds: 5.0
  # Fill the inventory cache at startup instead of on the first page load.
  startup_warm_cache_enabled: false
  # Also read SMART detail for every disk at startup (slower start, faster first page).
  startup_warm_smart_enabled: false
  # Upper bound on SMART reads running at the same time.
  smart_batch_max_concurrency: 12
  # Delay before the main UI starts fetching SMART detail in the background.
  smart_prefetch_delay_ms: 120
  # auto picks single or chunked from the disk count; chunked pages through
  # smart_prefetch_chunk_size disks at a time.
  smart_prefetch_strategy: auto
  smart_prefetch_single_threshold: 128
  smart_prefetch_chunk_size: 24
  smart_prefetch_batch_concurrency: 2
  # Parallel history reads while building an export.
  export_history_concurrency: 12
  # How long a disk inventory sync may run, and how often its progress is polled.
  disk_inventory_sync_timeout_seconds: 180
  disk_inventory_sync_poll_interval_seconds: 2.0
  # Export cache: entries expire after this many seconds, and the cache keeps at
  # most this many entries and this many bytes across history, HTML, and ZIP exports.
  export_cache_ttl_seconds: 60
  export_cache_max_entries: 8
  export_cache_max_bytes: 33554432
  # DEBUG, INFO, WARNING, or ERROR.
  log_level: INFO
  # Extra diagnostic output in logs and responses. Leave off in normal use.
  debug: false

perf:
  # Log per-request timing stages. Off unless you are chasing a slow page.
  enabled: false
  # Log every request, not only slow ones.
  log_all_requests: false
  # Requests or stages slower than these thresholds are logged when enabled.
  slow_request_ms: 1000
  slow_stage_ms: 250

# The primary storage system. To watch more than one, use the systems list
# further down instead; the app then ignores this section.
truenas:
  # Base appliance URL only, without /api/v2.0 or /qstorapi.
  host: https://truenas.example.test
  # Use TRUENAS_API_KEY (or the _FILE variant) in .env instead of writing a key here.
  api_key: ""
  # Username and password login for platforms without API keys (Quantastor).
  api_user: ""
  api_password: ""
  # core, scale, linux, quantastor, esxi, or ipmi. See the systems examples below.
  platform: core
  # The beginner default accepts the appliance certificate without verification.
  # For verified HTTPS against a private CA, set verify_ssl to true, point
  # tls_ca_bundle_path at a PEM bundle mounted under /app/config (for example
  # /app/config/ca/home-ca.pem), and set tls_server_name only when the
  # certificate name differs from the host in the URL.
  verify_ssl: false
  tls_ca_bundle_path: null
  tls_server_name: null
  timeout_seconds: 15
  # Optional substring match against enclosure id, name, or label.
  enclosure_filter: null

ssh:
  # SSH is optional. It adds disk-to-bay mapping detail the API cannot provide.
  enabled: false
  host: truenas.example.test
  # Optional extra node or controller hosts to try when the primary SSH host
  # does not expose the best enclosure-control path.
  extra_hosts: []
  # Quantastor HA only: see the quantastor example in the systems list.
  ha_enabled: false
  ha_nodes: []
  port: 22
  user: jbodmap
  # Mount your SSH key into ./config/ssh on the Docker host.
  key_path: /run/ssh/id_truenas
  # Optional: use this for password-only appliances when key auth is not available.
  password: ""
  # Optional: set via SSH_SUDO_PASSWORD in .env if your CORE build only supports
  # passworded command-limited sudo.
  sudo_password: ""
  # First connection pins the observed host key here, then future SSH
  # sessions must match it unless you remove the entry.
  known_hosts_path: /app/data/known_hosts
  strict_host_key_checking: true
  timeout_seconds: 15
  # Commands the read-only SSH user may run. These are the TrueNAS CORE defaults;
  # the systems examples below show the SCALE, Linux, and ESXi bundles.
  commands:
    - /sbin/glabel status
    - /usr/local/sbin/zpool status -gP
    - gmultipath list
    - sudo -n /usr/sbin/sesutil map
    - sudo -n /usr/sbin/sesutil show
  # Optional if you also allow SSH identify LED control through command-limited sudo:
  #  - sudo -n /usr/sbin/sesutil locate -u /dev/ses4 16 on
  #  - sudo -n /usr/sbin/sesutil locate -u /dev/ses4 16 off
  # Optional extra hint source if you also allow command-limited sudo for camcontrol:
  #  - sudo -n /sbin/camcontrol devlist -v

history:
  # Where the main UI reads disk history from. docker-compose.yml sets
  # HISTORY_BACKEND_URL to http://enclosure-history:8001 when the history
  # service is enabled; leave empty to run without history.
  service_url: ""
  timeout_seconds: 10
  # Concurrent per-disk history requests when the batched read fails.
  fallback_max_concurrency: 4
  # Token that lets the main UI ask the history service for a refresh. Set it
  # with HISTORY_REFRESH_TOKEN in .env rather than here.
  refresh_token: ""

admin:
  # Where the main UI reaches the optional admin service. docker-compose.yml
  # sets ADMIN_SERVICE_URL to http://enclosure-admin:8002 when admin is enabled.
  service_url: ""
  # URL the browser uses to open admin, if it differs from the service URL.
  public_url: null
  port: 8082
  # How long the main UI waits for admin before treating it as stopped.
  timeout_seconds: 0.75

