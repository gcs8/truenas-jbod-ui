# Optional hardening. Prepare bind-mount ownership before first adoption.
# Keep this overlay in the Compose chain on every later image-only update.
services:
  enclosure-ui:
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./config:/app/config:ro

  enclosure-history:
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  enclosure-admin:
    user: "0:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - "no-new-privileges:true"

  enclosure-backup:
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    # Inherit group_add from the base; Compose appends overlay list entries.
