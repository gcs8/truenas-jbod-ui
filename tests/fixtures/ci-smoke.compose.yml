name: truenas-jbod-ui-ci-smoke

services:
  enclosure-ui:
    build:
      context: ../..
      dockerfile: Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      APP_CONFIG_PATH: /app/config/config.yaml
      HISTORY_BACKEND_URL: ""
      ADMIN_SERVICE_URL: ""
    ports:
      - "18080:8000"
    volumes:
      - ./ci-smoke-config.yaml:/app/config/config.yaml:ro
      - ${CI_SMOKE_DATA_DIR:?CI_SMOKE_DATA_DIR is required}:/app/data
      - ${CI_SMOKE_LOG_DIR:?CI_SMOKE_LOG_DIR is required}:/app/logs
    tmpfs:
      - /tmp
      - /run/ssh:uid=10001,gid=10001,mode=0750
    restart: "no"
