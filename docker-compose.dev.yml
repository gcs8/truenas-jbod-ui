services:
  enclosure-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truenas-jbod-ui
    user: "0:0"
    env_file:
      - .env
    environment:
      HISTORY_BACKEND_URL: http://enclosure-history:8001
      HISTORY_BACKEND_TIMEOUT: ${HISTORY_BACKEND_TIMEOUT:-10}
      ADMIN_SERVICE_URL: http://enclosure-admin:8002
      ADMIN_PORT: ${ADMIN_PORT:-8082}
      ADMIN_BIND_ADDRESS: ${ADMIN_BIND_ADDRESS:-0.0.0.0}
      ADMIN_TIMEOUT_SECONDS: ${ADMIN_TIMEOUT_SECONDS:-0.75}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-network}
      ADMIN_AUTH_USERNAME: ${ADMIN_AUTH_USERNAME:-}
      ADMIN_AUTH_PASSWORD: ${ADMIN_AUTH_PASSWORD:-}
      SCHEDULED_BACKUP_STATUS_FILE: ${SCHEDULED_BACKUP_STATUS_FILE:-}
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/ssh:/run/ssh:ro
      - ./backup-status:/app/backup-status:ro
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-1g}

  enclosure-history:
    profiles:
      - history
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truenas-jbod-history
    user: "0:0"
    command: ["uvicorn", "history_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      HISTORY_SOURCE_BASE_URL: http://enclosure-ui:8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      HISTORY_SQLITE_PATH: /app/history/history.db
      HISTORY_SEGMENT_CATALOG_PATH: ${HISTORY_SEGMENT_CATALOG_PATH:-}
      HISTORY_PERMISSION_REPAIR_ENABLED: ${HISTORY_PERMISSION_REPAIR_ENABLED:-false}
      HISTORY_SHARED_DIR_MODE: ${HISTORY_SHARED_DIR_MODE:-0770}
      HISTORY_SHARED_FILE_MODE: ${HISTORY_SHARED_FILE_MODE:-0660}
      HISTORY_BACKUP_DIR: ${HISTORY_BACKUP_DIR:-/app/history/backups}
      HISTORY_BACKUP_RETENTION_COUNT: ${HISTORY_BACKUP_RETENTION_COUNT:-28}
      HISTORY_BACKUP_INTERVAL_SECONDS: ${HISTORY_BACKUP_INTERVAL_SECONDS:-3600}
      SCHEDULED_BACKUP_STATUS_FILE: ${SCHEDULED_BACKUP_STATUS_FILE:-}
      HISTORY_SEGMENTED_BACKUP_MAX_AGE_SECONDS: ${HISTORY_SEGMENTED_BACKUP_MAX_AGE_SECONDS:-129600}
      HISTORY_LONG_TERM_BACKUP_DIR: ${HISTORY_LONG_TERM_BACKUP_DIR:-/app/history/backups/long-term}
      HISTORY_WEEKLY_BACKUP_RETENTION_COUNT: ${HISTORY_WEEKLY_BACKUP_RETENTION_COUNT:-4}
      HISTORY_MONTHLY_BACKUP_RETENTION_COUNT: ${HISTORY_MONTHLY_BACKUP_RETENTION_COUNT:-3}
      HISTORY_POLL_INTERVAL_SECONDS: ${HISTORY_POLL_INTERVAL_SECONDS:-300}
      HISTORY_FAST_INTERVAL_SECONDS: ${HISTORY_FAST_INTERVAL_SECONDS:-300}
      HISTORY_SLOW_INTERVAL_SECONDS: ${HISTORY_SLOW_INTERVAL_SECONDS:-3600}
      HISTORY_REQUEST_TIMEOUT_SECONDS: ${HISTORY_REQUEST_TIMEOUT_SECONDS:-45}
      HISTORY_FAILURE_BACKOFF_INITIAL_SECONDS: ${HISTORY_FAILURE_BACKOFF_INITIAL_SECONDS:-30}
      HISTORY_FAILURE_BACKOFF_MAX_SECONDS: ${HISTORY_FAILURE_BACKOFF_MAX_SECONDS:-900}
      HISTORY_SMART_BATCH_SIZE: ${HISTORY_SMART_BATCH_SIZE:-24}
      HISTORY_STARTUP_GRACE_SECONDS: ${HISTORY_STARTUP_GRACE_SECONDS:-20}
      HISTORY_FORCE_INVENTORY_ON_FAST_COLLECTION: ${HISTORY_FORCE_INVENTORY_ON_FAST_COLLECTION:-false}
      HISTORY_RAW_METRIC_RETENTION_DAYS: ${HISTORY_RAW_METRIC_RETENTION_DAYS:-30}
      HISTORY_EVENT_RETENTION_DAYS: ${HISTORY_EVENT_RETENTION_DAYS:-365}
      HISTORY_HOURLY_ROLLUP_RETENTION_DAYS: ${HISTORY_HOURLY_ROLLUP_RETENTION_DAYS:-365}
      HISTORY_DAILY_ROLLUP_RETENTION_DAYS: ${HISTORY_DAILY_ROLLUP_RETENTION_DAYS:-1825}
      HISTORY_RETENTION_INTERVAL_SECONDS: ${HISTORY_RETENTION_INTERVAL_SECONDS:-3600}
      HISTORY_RETENTION_BATCH_SIZE: ${HISTORY_RETENTION_BATCH_SIZE:-5000}
      HISTORY_RETENTION_MAX_BATCHES_PER_RUN: ${HISTORY_RETENTION_MAX_BATCHES_PER_RUN:-20}
    ports:
      - "${HISTORY_BIND_ADDRESS:-127.0.0.1}:${HISTORY_PORT:-8081}:8001"
    volumes:
      - ./history:/app/history
      - ./backup-status:/app/backup-status:ro
    depends_on:
      enclosure-ui:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${HISTORY_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  enclosure-admin:
    profiles:
      - admin
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truenas-jbod-admin
    user: "0:0"
    command: ["uvicorn", "admin_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file:
      - .env
    environment:
      HISTORY_SQLITE_PATH: /app/history/history.db
      HISTORY_SEGMENT_CATALOG_PATH: ${HISTORY_SEGMENT_CATALOG_PATH:-}
      HISTORY_BACKUP_DIR: ${HISTORY_BACKUP_DIR:-/app/history/backups}
      HISTORY_LONG_TERM_BACKUP_DIR: ${HISTORY_LONG_TERM_BACKUP_DIR:-/app/history/backups/long-term}
      ADMIN_PORT: 8002
      ADMIN_BIND_ADDRESS: ${ADMIN_BIND_ADDRESS:-0.0.0.0}
      ADMIN_AUTO_STOP_SECONDS: ${ADMIN_AUTO_STOP_SECONDS:-3600}
      ADMIN_CONTAINER_UI_NAME: truenas-jbod-ui
      ADMIN_CONTAINER_HISTORY_NAME: truenas-jbod-history
      ADMIN_CONTAINER_ADMIN_NAME: truenas-jbod-admin
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-network}
      ADMIN_AUTH_USERNAME: ${ADMIN_AUTH_USERNAME:-}
      ADMIN_AUTH_PASSWORD: ${ADMIN_AUTH_PASSWORD:-}
      ADMIN_ALLOW_PLAINTEXT_BACKUP_EXPORT: ${ADMIN_ALLOW_PLAINTEXT_BACKUP_EXPORT:-false}
      ADMIN_CLEAN_BACKUP_TARGETS_JSON: '${ADMIN_CLEAN_BACKUP_TARGETS_JSON:-["ui","history"]}'
    ports:
      - "${ADMIN_BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8082}:8002"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./history:/app/history
      - ./logs:/app/logs
      - ./config/ssh:/run/ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
    mem_limit: ${ADMIN_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  enclosure-backup:
    profiles:
      - backup
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "history_service.scheduled_backup_main"]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    network_mode: none
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_GID: ${APP_GID:-10001}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      HISTORY_SQLITE_PATH: /app/history/history.db
      HISTORY_SEGMENT_CATALOG_PATH: ${HISTORY_SEGMENT_CATALOG_PATH:-}
      HISTORY_BACKUP_DIR: /app/history/backups
      SCHEDULED_BACKUP_ENABLED: ${SCHEDULED_BACKUP_ENABLED:-false}
      SCHEDULED_BACKUP_DIR: ${SCHEDULED_BACKUP_DIR:-}
      SCHEDULED_BACKUP_STATUS_FILE: ${SCHEDULED_BACKUP_STATUS_FILE:-}
      SCHEDULED_BACKUP_RETENTION_COUNT: ${SCHEDULED_BACKUP_RETENTION_COUNT:-0}
      SCHEDULED_BACKUP_INCLUDED_GROUPS_JSON: '${SCHEDULED_BACKUP_INCLUDED_GROUPS_JSON:-[]}'
      SCHEDULED_BACKUP_PASSPHRASE_FILE: ${SCHEDULED_BACKUP_PASSPHRASE_FILE:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ./history:/app/history
      - ./backups:/app/backups
      - ./backup-status:/app/backup-status
      - ./config/ssh:/run/ssh:ro
      - ./config/backup-secrets:/run/backup-secrets:ro
    restart: "no"
    mem_limit: ${BACKUP_MEM_LIMIT:-3g}
    healthcheck:
      disable: true
