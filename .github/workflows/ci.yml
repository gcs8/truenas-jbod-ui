name: CI Preflight

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff-hygiene:
    name: Diff hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ]; then
            git diff --check "${PR_BASE_SHA}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BEFORE_SHA}..HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check "HEAD^..HEAD"
          else
            git diff --check
          fi

      - name: Confirm checkout stayed clean
        run: |
          set -euo pipefail
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  python-source:
    name: Python compile and unittest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Install pinned promtool
        env:
          PROMTOOL_VERSION: "3.5.0"
          PROMTOOL_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/promtool-${PROMTOOL_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "$PROMTOOL_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" \
            --strip-components=1 \
            -C "$install_dir" \
            "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          chmod 0755 "$install_dir/promtool"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Validate starter Prometheus alert rules
        run: |
          promtool check rules prometheus/rules/truenas-jbod-ui-alerts-v1.yml
          python -m unittest tests.test_prometheus_alert_rules -v

      - name: Compile Python source
        run: python -m compileall app admin_service history_service scripts tests

      - name: Run deterministic unittest suite
        if: matrix.python-version != '3.12'
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run deterministic unittest suite with report-only coverage
        if: matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report
          coverage xml -o coverage.xml

      - name: Check deterministic performance baseline
        run: python scripts/build_perf_baseline.py --check

      - name: Upload coverage XML artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage-xml
          path: coverage.xml
          if-no-files-found: error

  ruff-check:
    name: Bounded Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run bounded Ruff rules
        run: ruff check app admin_service history_service scripts tests --select E4,E7,E9,F

  javascript-source:
    name: JavaScript syntax and npm lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          shopt -s nullglob
          node --check app/static/app.js
          node --check app/static/sas_fabric_view.js
          node --check admin_service/static/admin.js
          specs=(qa/*.spec.js)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No QA spec files found under qa/*.spec.js"
            exit 1
          fi
          for spec in "${specs[@]}"; do
            node --check "$spec"
          done

      - name: Run deterministic JavaScript unit tests
        run: npm run test:unit

  container-smoke:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build production image and verify cache-only health
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/truenas-jbod-ui-bind-smoke"
          export CI_SMOKE_DATA_DIR="${smoke_root}/data"
          export CI_SMOKE_LOG_DIR="${smoke_root}/logs"
          shared_probe_dir="${smoke_root}/shared"
          backup_secret_dir="${smoke_root}/backup-secrets"
          sudo install -d -m 0770 -o 10001 -g 10001 "$CI_SMOKE_DATA_DIR" "$CI_SMOKE_LOG_DIR"
          sudo install -d -m 0770 -o 10001 -g 10001 "$shared_probe_dir"
          sudo install -d -m 0700 -o 1000 -g 1000 "$backup_secret_dir"
          sudo install -m 0660 -o 10001 -g 10001 /dev/null "$shared_probe_dir/app-data"
          sudo install -m 0600 -o 1000 -g 1000 /dev/null "$backup_secret_dir/passphrase"
          printf 'shared' | sudo tee "$shared_probe_dir/app-data" >/dev/null
          printf 'synthetic-test-value' | sudo tee "$backup_secret_dir/passphrase" >/dev/null
          trap 'docker compose -f tests/fixtures/ci-smoke.compose.yml down --volumes --remove-orphans' EXIT
          docker compose -f tests/fixtures/ci-smoke.compose.yml up -d --build --wait --wait-timeout 90
          python - <<'PY'
          import json
          import urllib.request

          def get_json(url: str) -> dict[str, object]:
              with urllib.request.urlopen(url, timeout=5) as response:
                  assert response.status == 200
                  return json.load(response)

          live = get_json("http://127.0.0.1:18080/livez")
          health = get_json("http://127.0.0.1:18080/healthz")
          assert live["status"] == "ok"
          assert health == {
              "status": "ok",
              "dependency_status": "unknown",
              "last_updated": None,
              "sources": {},
              "warnings": [],
              "cache_state": "empty",
          }
          PY
          container_id="$(docker compose -f tests/fixtures/ci-smoke.compose.yml ps -q enclosure-ui)"
          docker exec -i "$container_id" python - <<'PY'
          import os
          from pathlib import Path

          assert os.getuid() == 10001
          assert os.getgid() == 10001
          data_probe = Path("/app/data/nonroot-smoke")
          log_probe = Path("/app/logs/nonroot-smoke")
          data_probe.write_text("ok", encoding="utf-8")
          log_probe.write_text("ok", encoding="utf-8")
          assert data_probe.read_text(encoding="utf-8") == "ok"
          assert log_probe.read_text(encoding="utf-8") == "ok"
          data_probe.unlink()
          log_probe.unlink()
          PY
          image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          docker run --rm -i --user 1000:1000 --group-add 10001 \
            -v "$shared_probe_dir:/probe/shared:ro" \
            -v "$backup_secret_dir:/probe/backup-secrets:ro" \
            "$image_id" python - <<'PY'
          import os
          from pathlib import Path

          assert os.getuid() == 1000
          assert os.getgid() == 1000
          assert 10001 in os.getgroups()
          assert Path("/probe/shared/app-data").read_text(encoding="utf-8") == "shared"
          assert Path("/probe/backup-secrets/passphrase").read_text(encoding="utf-8") == "synthetic-test-value"
          print("backup_identity_and_group_access=ok")
          PY
          docker run --rm -i \
            -v "$backup_secret_dir:/probe/backup-secrets:ro" \
            "$image_id" python - <<'PY'
          from pathlib import Path

          try:
              Path("/probe/backup-secrets/passphrase").read_text(encoding="utf-8")
          except PermissionError:
              print("ui_backup_secret_access=denied")
          else:
              raise AssertionError("UI identity read the backup-only passphrase")
          PY

  admin-browser-cleanroom:
    name: Admin clean-room browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts

      - name: Use hosted Chrome for browser checks
        run: google-chrome --version

      - name: Run admin browser checks against the clean-room fixture
        env:
          ADMIN_AUTO_STOP_SECONDS: "0"
          ADMIN_DOCKER_SOCKET_PATH: /tmp/truenas-jbod-ui-admin-cleanroom/missing-docker.sock
          ADMIN_HOST_PREP_TEMP_DIR: /tmp/truenas-jbod-ui-admin-cleanroom/host-prep
          APP_CONFIG_PATH: ${{ github.workspace }}/qa/fixtures/admin-cleanroom-config.yaml
          HISTORY_SQLITE_PATH: /tmp/truenas-jbod-ui-admin-cleanroom/history/history.db
          PLAYWRIGHT_ADMIN_BASE_URL: http://127.0.0.1:8082
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          runtime_root=/tmp/truenas-jbod-ui-admin-cleanroom
          rm -rf "$runtime_root"
          mkdir -p "$runtime_root"
          python -m uvicorn admin_service.main:app --host 127.0.0.1 --port 8082 >"$runtime_root/admin.log" 2>&1 &
          admin_pid=$!
          cleanup() {
            kill "$admin_pid" 2>/dev/null || true
            wait "$admin_pid" 2>/dev/null || true
            rm -rf "$runtime_root"
          }
          trap cleanup EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8082/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npx playwright test qa/admin-operations.spec.js
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  public-demo-artifact:
    name: Checked-in public demo artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - javascript-source
      - python-source
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify checked-in public demo is publishable
        run: python scripts/check_public_demo_artifact.py public-demo

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser QA dependencies
        run: npm ci --ignore-scripts

      - name: Use hosted Chrome for browser smoke tests
        run: google-chrome --version

      - name: Smoke test checked-in public demo artifact
        env:
          PUBLIC_DEMO_ARTIFACT: public-demo/index.html
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npx playwright test qa/public-demo.spec.js

      - name: Confirm public demo checks did not rewrite source
        run: |
          set -euo pipefail
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
