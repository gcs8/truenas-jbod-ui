name: Published image scan

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/published-image-scan.yml
      - .github/scripts/published_image_scan.py
      - .github/tests/test_published_image_scan.py
      - .github/PUBLISHED_IMAGE_SCAN.md
      - .trivyignore.yaml
      - tests/test_ci_contract.py
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Published image scan offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install policy parser
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.4
      - name: Test synthetic scanners and local HTTP issue reconciliation
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m unittest discover -s .github/tests -p 'test_published_image_scan.py' -v
          python -m unittest tests.test_ci_contract -v
      - name: Validate native ignore policy without network
        run: python .github/scripts/published_image_scan.py validate

  scan:
    name: Published image scan and issue reconciliation
    needs: [test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      issues: write
    concurrency:
      group: published-image-scan-writer
      cancel-in-progress: false
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install policy parser
        run: |
          python -m pip install --only-binary=:all: PyYAML==6.0.4
      - name: Scan every resolved published target without issue credentials
        env:
          TMPDIR: ${{ runner.temp }}
        run: python .github/scripts/published_image_scan.py scan --bundle "$RUNNER_TEMP/published-image-scan.json"
      - name: Reconcile the complete validated finding set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/published_image_scan.py sync --bundle "$RUNNER_TEMP/published-image-scan.json"
