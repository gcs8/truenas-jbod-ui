name: Secret scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all reachable history including pull-request ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install the checksum-verified pinned upstream scanner
        env:
          TMPDIR: ${{ runner.temp }}
          GITLEAKS_BINARY: ${{ runner.temp }}/secret-scan-tools/gitleaks
        run: python .github/scripts/secret_scan.py install "$RUNNER_TEMP/secret-scan-tools"

      - name: Test ignore policy and native synthetic history detection offline
        env:
          TMPDIR: ${{ runner.temp }}
          GITLEAKS_BINARY: ${{ runner.temp }}/secret-scan-tools/gitleaks
        run: python -m unittest discover -s .github/tests -p 'test_secret_scan.py' -v

      - name: Scan all reachable history with fully redacted private reports
        env:
          TMPDIR: ${{ runner.temp }}
          GITLEAKS_BINARY: ${{ runner.temp }}/secret-scan-tools/gitleaks
        run: python .github/scripts/secret_scan.py scan --binary "$GITLEAKS_BINARY"
