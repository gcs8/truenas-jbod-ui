name: Publish Public Demo

on:
  pull_request:
    paths:
      - ".github/workflows/publish-public-demo.yml"
      - "app/__init__.py"
      - "app/config.py"
      - "app/logging_config.py"
      - "app/main.py"
      - "app/metrics.py"
      - "app/models/domain.py"
      - "app/perf.py"
      - "app/request_context.py"
      - "app/script_json.py"
      - "app/secret_files.py"
      - "app/services/history_backend.py"
      - "app/services/history_status.py"
      - "app/services/profile_registry.py"
      - "app/services/public_demo_fixture.py"
      - "app/services/snapshot_export.py"
      - "app/services/storage_view_templates.py"
      - "app/services/storage_views.py"
      - "app/slot_layout.py"
      - "app/static/app.js"
      - "app/static/images/aoc-slg4-2h8m2.jpg"
      - "app/static/images/hyper-m2-gen3-card.png"
      - "app/static/images/satadom-ml-3ie3-v2.png"
      - "app/static/style.css"
      - "app/templates/base.html"
      - "app/templates/index.html"
      - "history_service/operation_bounds.py"
      - "history_service/scheduled_backup.py"
      - "public-demo/**"
      - "qa/public-demo.spec.js"
      - "README.md"
      - "docs/DOCUMENTATION_INVENTORY.md"
      - "docs/PUBLIC_DEMO_PRODUCT_BRIEF.md"
      - "docs/PUBLIC_SCREENSHOT_REVIEW.md"
      - "docs/images/screenshots/**"
      - "wiki/**"
      - "scripts/build_current_source_browser_fixture.py"
      - "scripts/build_public_demo.py"
      - "scripts/check_public_demo_artifact.py"
      - "scripts/check_public_demo_deployment.py"
      - "scripts/check_public_docs.py"
      - "scripts/check_public_screenshots.py"
      - "scripts/public_demo_inputs.py"
      - "scripts/public_demo_source_parity.py"
      - "tests/fixtures/public_demo/public_demo.json"
  push:
    branches:
      - main
    paths:
      - "public-demo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static public demo
    runs-on: ubuntu-latest
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.artifact_sha256 }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check publishable artifact
        run: python scripts/check_public_demo_artifact.py public-demo

      - name: Check README, Wiki, links, examples, and screenshots
        run: |
          python scripts/check_public_docs.py --check-external --external-timeout-seconds 15 --external-max-attempts 2
          python scripts/check_public_screenshots.py

      - name: Record source and artifact identities
        id: identity
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum public-demo/index.html | cut -d' ' -f1)"
          printf 'source_sha=%s\n' "${GITHUB_SHA}"
          printf 'artifact_sha256=%s\n' "$artifact_sha256"
          printf 'artifact_sha256=%s\n' "$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser QA dependencies
        run: npm ci --ignore-scripts

      - name: Use hosted Chrome for browser smoke tests
        run: google-chrome --version

      - name: Smoke test checked-in artifact and current-source fixture
        env:
          PUBLIC_DEMO_ARTIFACT: public-demo/index.html
          SLOT_FOCUS_ARTIFACT: ${{ runner.temp }}/truenas-jbod-ui-current-source-browser/index.html
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          fixture_root="$(dirname "$SLOT_FOCUS_ARTIFACT")"
          cleanup() {
            result=$?
            rm -rf "$fixture_root"
            status="$(git status --short)"
            if [ -n "$status" ]; then
              printf '%s\n' "$status"
              exit 1
            fi
            exit "$result"
          }
          trap cleanup EXIT
          rm -rf "$fixture_root"
          mkdir -p "$fixture_root"
          python scripts/build_current_source_browser_fixture.py --output "$SLOT_FOCUS_ARTIFACT"
          npx playwright test qa/public-demo.spec.js --retries=0

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public-demo

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  readback:
    name: Verify published Pages bytes and browser route
    if: github.event_name == 'workflow_dispatch'
    needs:
      - verify
      - deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Require exact anonymous Pages bytes
        run: |
          python scripts/check_public_demo_deployment.py \
            --url "${{ needs.deploy.outputs.page_url }}" \
            --artifact public-demo/index.html

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser QA dependencies
        run: npm ci --ignore-scripts

      - name: Verify the anonymous Pages route in Chrome
        env:
          PUBLIC_DEMO_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npx playwright test qa/public-demo.spec.js --retries=0 --grep "published public demo"
